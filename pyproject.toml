[project]
name = "ag-cli-py-build"
version = "0.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "bin2whl==1.0.2",
    "packaging==26.3",
    "wheel==0.48.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "twine>=7.0.0",
]
